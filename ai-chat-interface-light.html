<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Demo Light</title>
    <style>
      /* NLU Chatbot Interface Style Guide */

      :root {
        /* Light Color System */
        --primary-bg: #ffffff;
        --secondary-bg: #f5f5f5;
        --tertiary-bg: #dcdcdc; /* Light gray for scrollbars */
        --accent-color: #87d4ed; /* NLU dark blue */
        --text-primary: #1e1e1e;
        --text-secondary: #4a4a4a;
        --user-message-bg: #87d4ed;
        --ai-message-bg: #f0f4f8;
        --border-color: #cccccc;

        /* Typography */
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
        --font-size-base: 16px;
        --font-size-small: 14px;
        --line-height-base: 1.6;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: var(--primary-bg);
        color: var(--text-primary);
        font-family: var(--font-family);
        font-size: var(--font-size-base);
        line-height: var(--line-height-base);
        overflow: hidden;
      }

      .chat-container {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 1rem;
        padding-bottom: 110px; /* Make space for the input form */
        max-width: 800px; /* Set max width for the chat interface */
        margin: 0 auto; /* Center the chat interface */
      }

      .message-history {
        flex-grow: 1;
        overflow-y: auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      /* Custom scrollbar for a modern look */
      .message-history::-webkit-scrollbar {
        width: 8px;
        border-radius: 4px; /* Apply border-radius to the scrollbar itself */
      }

      .message-history::-webkit-scrollbar-track {
        background: var(--secondary-bg);
        border-radius: 4px; /* Round the track */
      }

      .message-history::-webkit-scrollbar-thumb {
        background-color: var(--tertiary-bg);
        border-radius: 4px;
      }

      .message {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 1.25rem;
        word-wrap: break-word;
      }

      .message.user {
        background-color: var(--user-message-bg);
        color: var(--text-primary);
        align-self: flex-end;
        border-bottom-right-radius: 0.25rem;
      }

      .message.ai {
        background-color: var(--ai-message-bg);
        color: var(--text-primary);
        align-self: flex-start;
        border-bottom-left-radius: 0.25rem;
      }

      .message.ai h1,
      .message.ai h2,
      .message.ai h3 {
        margin-top: 0.5em;
        margin-bottom: 0.5em;
      }

      .message.ai p {
        margin-bottom: 0.2em;
      }

      .message.ai ul,
      .message.ai ol {
        padding-left: 1.5em;
        margin-bottom: 0.5em;
      }

      .message.ai li {
        margin-bottom: 0.25em;
      }

      .message.ai code {
        background-color: var(--primary-bg);
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-family: "Courier New", Courier, monospace;
      }

      .message.ai pre {
        background-color: var(--primary-bg);
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
      }

      .thinking-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        align-self: flex-start;
      }

      .thinking-indicator .dot {
        width: 8px;
        height: 8px;
        background-color: var(--text-secondary);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .thinking-indicator .dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .thinking-indicator .dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .input-form-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 1rem;
        background-color: var(--primary-bg);
        border-top: 1px solid var(--border-color);
      }

      .input-form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        max-width: 800px;
        margin: 0 auto;
        background-color: var(--secondary-bg);
        border-radius: 1.5rem;
        padding: 0.3rem;
        border: 1px solid var(--border-color);
      }

      .message-input {
        flex-grow: 1;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-family: inherit;
        font-size: var(--font-size-base);
        padding: 0.5rem 0.75rem 0.75rem 0.75rem;
        resize: none;
        max-height: 179.2px; /* Limit max height to 7 lines (16px * 1.6 line-height * 7 lines) */
        overflow-y: hidden;
        line-height: 1.6;
      }

      /* Custom scrollbar for message input */
      .message-input::-webkit-scrollbar {
        width: 8px;
        border-radius: 4px; /* Apply border-radius to the scrollbar itself */
      }

      .message-input::-webkit-scrollbar-track {
        background: var(--secondary-bg);
        border-radius: 4px; /* Round the track */
      }

      .message-input::-webkit-scrollbar-thumb {
        background-color: var(--tertiary-bg);
        border-radius: 4px;
      }

      .message-input:focus {
        outline: none;
      }

      .mic-button {
        background-color: transparent;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s;
        flex-shrink: 0;
      }

      .mic-button:hover,
      .mic-button:focus {
        background-color: var(--secondary-bg);
      }

      .mic-button.is-recording {
        background-color: #e24a4a; /* Red to indicate recording */
        animation: pulse 1.5s infinite;
      }

      .mic-button.is-recording:hover,
      .mic-button.is-recording:focus {
        background-color: #d23a3a;
      }

      .mic-button svg {
        width: 20px;
        height: 20px;
        fill: var(--text-secondary);
      }

      .mic-button.is-recording svg {
        fill: var(--text-primary);
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(226, 74, 74, 0.7);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(226, 74, 74, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(226, 74, 74, 0);
        }
      }

      .send-button {
        background-color: var(--accent-color);
        border: none;
        border-radius: 50%;
        width: 36px; /* Smaller size */
        height: 36px; /* Smaller size */
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s;
        flex-shrink: 0;
      }

      .send-button:hover,
      .send-button:focus {
        background-color: #3a80d2;
      }

      .send-button:disabled {
        background-color: var(--tertiary-bg);
        cursor: not-allowed;
      }

      .send-button svg {
        width: 20px; /* Smaller size */
        height: 20px; /* Smaller size */
        fill: var(--text-primary);
      }

      /* Table Styling */
      .message.ai table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1em;
        margin-bottom: 1em;
        background-color: var(--primary-bg);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        overflow: hidden; /* Ensures rounded corners apply to content */
      }

      .message.ai th,
      .message.ai td {
        padding: 0.75em 1em;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      .message.ai th {
        background-color: var(--secondary-bg);
        color: var(--text-primary);
        font-weight: bold;
      }

      .message.ai tr:last-child td {
        border-bottom: none;
      }

      .message.ai tbody tr:nth-child(odd) {
        background-color: var(--ai-message-bg);
      }

      .message.ai tbody tr:nth-child(even) {
        background-color: var(--ai-message-bg);
      }

      .message.ai tbody tr:hover {
        background-color: var(--secondary-bg);
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        body {
          font-size: 14px;
        }
        .message {
          max-width: 90%;
        }
        .input-form-container {
          padding: 0.5rem;
        }
        .input-form {
          padding: 0.25rem 0.5rem;
        }
        .message-input {
          padding: 0.5rem;
        }
        .send-button {
          width: 32px; /* Smaller size for responsive */
          height: 32px; /* Smaller size for responsive */
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <main class="chat-container" aria-live="polite">
      <section
        class="message-history"
        id="message-history"
        aria-label="Chat History"
      ></section>
    </main>

    <div class="input-form-container">
      <form class="input-form" id="chat-form" aria-label="Chat Input Form">
        <textarea
          class="message-input"
          rows="1"
          id="message-input"
          placeholder="Type your message..."
          aria-label="Message Input"
        ></textarea>
        <button
          class="mic-button"
          id="mic-button"
          type="button"
          aria-label="Use Microphone"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
            ></path>
          </svg>
        </button>
        <button
          class="send-button"
          id="send-button"
          type="submit"
          aria-label="Send Message"
          disabled
        >
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const micButton = document.getElementById("mic-button");
        const messageHistory = document.getElementById("message-history");
        let recognitionUpdate = false;
        let conversationHistory = [
          {
            role: "user",
            parts: [
              {
                text: "You are a helpful AI assistant.",
              },
            ],
          },
          {
            role: "model",
            parts: [{ text: "Understood. I will provide concise responses." }],
          },
        ];

        const OPENROUTER_API_KEY =
          "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"; // Replace with your actual key
        const OPENROUTER_MODEL = "google/gemini-2.5-flash"; // User-selected model

        // Helper to safely parse JSON
        async function safeJson(res) {
          try {
            return await res.json();
          } catch {
            return null;
          }
        }

        // Converts Gemini-style history to OpenRouter/OpenAI-style messages
        function toOpenRouterMessages(history) {
          return history.map((m) => {
            const text = (m.parts || []).map((p) => p.text).join("");
            if (m.role === "model") return { role: "assistant", content: text };
            if (m.role === "user") return { role: "user", content: text };
            return { role: "user", content: text }; // Fallback for other roles
          });
        }

        // --- Speech Recognition Setup ---
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let initialText = ""; // To store text before recognition starts

        if (SpeechRecognition) {
          recognition = new SpeechRecognition();
          recognition.continuous = true; // Keep listening until stopped
          recognition.interimResults = true;

          micButton.addEventListener("click", () => {
            if (micButton.classList.contains("is-recording")) {
              recognition.stop();
            } else {
              initialText = input.value; // Save current text
              recognition.start();
            }
          });

          recognition.onstart = () => {
            micButton.classList.add("is-recording");
            input.placeholder = "Listening...";
          };

          recognition.onend = () => {
            micButton.classList.remove("is-recording");
            input.placeholder = "Type your message...";
          };

          recognition.onresult = (event) => {
            let interimTranscript = "";
            let finalTranscript = "";

            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
              } else {
                interimTranscript += event.results[i][0].transcript;
              }
            }

            // Append new transcript to the initial text
            const newText = initialText
              ? initialText + " " + finalTranscript
              : finalTranscript;
            recognitionUpdate = true;
            input.value = newText + interimTranscript;
            recognitionUpdate = false;

            if (finalTranscript) {
              initialText = newText;
            }

            autoResizeTextarea(input);
            toggleSendButton();
          };

          recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            micButton.classList.remove("is-recording");
            input.placeholder = "Type your message...";
          };
        } else {
          console.warn("Speech Recognition not supported in this browser.");
          micButton.style.display = "none";
        }

        // --- Event Listeners ---

        // --- Core Functions ---

        function sendMessage() {
          // Stop recognition if it's running
          if (
            SpeechRecognition &&
            micButton.classList.contains("is-recording")
          ) {
            recognition.stop();
          }
          const messageText = input.value.trim();
          if (messageText) {
            addMessage(messageText, "user");
            conversationHistory.push({
              role: "user",
              parts: [{ text: messageText }],
            });
            input.value = "";
            initialText = ""; // Reset initial text
            input.style.height = "auto"; // Reset height
            toggleSendButton();
            showThinkingIndicator();
            getOpenRouterResponse(); // Call the new OpenRouter function
          }
        }

        // --- Event Listeners ---

        // Handle form submission
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          sendMessage();
        });

        // Auto-resize textarea and toggle send button
        input.addEventListener("input", () => {
          if (recognitionUpdate) return;

          if (micButton.classList.contains("is-recording")) {
            recognition.stop();
          }
          autoResizeTextarea(input);
          toggleSendButton();
        });

        // Handle Enter to send message and Shift+Enter for new line
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault(); // Prevent default Enter behavior (new line)
            sendMessage();
          }
        });

        function addMessage(text, sender) {
          const messageElement = document.createElement("div");
          messageElement.classList.add("message", sender);

          if (sender === "ai") {
            messageElement.innerHTML = marked.parse(text);
          } else {
            messageElement.textContent = text;
          }

          messageHistory.appendChild(messageElement);

          // If the message is from the AI, scroll to the last user message.
          // Otherwise, scroll to the bottom.
          if (sender === "ai") {
            const userMessages =
              messageHistory.querySelectorAll(".message.user");
            if (userMessages.length > 0) {
              const lastUserMessage = userMessages[userMessages.length - 1];
              lastUserMessage.scrollIntoView({
                behavior: "smooth",
                block: "start",
              });
            } else {
              scrollToBottom(); // Fallback for first message
            }
          } else {
            scrollToBottom();
          }
        }

        function showThinkingIndicator() {
          const indicator = document.createElement("div");
          indicator.classList.add("thinking-indicator");
          indicator.id = "thinking-indicator";
          indicator.innerHTML = `
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                `;
          messageHistory.appendChild(indicator);
          scrollToBottom();
        }

        function hideThinkingIndicator() {
          const indicator = document.getElementById("thinking-indicator");
          if (indicator) {
            indicator.remove();
          }
        }

        function toggleSendButton() {
          sendButton.disabled = input.value.trim() === "";
        }

        function autoResizeTextarea(textarea) {
          const maxHeight = 179.2; // Corresponds to the CSS max-height
          textarea.style.height = "auto"; // Reset height to recalculate
          const newHeight = textarea.scrollHeight;

          if (newHeight > maxHeight) {
            textarea.style.height = `${maxHeight}px`;
            textarea.style.overflowY = "auto";
          } else {
            textarea.style.height = `${newHeight}px`;
            textarea.style.overflowY = "hidden";
          }
        }

        function scrollToBottom() {
          messageHistory.scrollTop = messageHistory.scrollHeight;
        }

        // --- OpenRouter API Interaction ---

        async function getOpenRouterResponse() {
          const url = "https://openrouter.ai/api/v1/chat/completions";
          const messages = toOpenRouterMessages(conversationHistory);

          try {
            const response = await fetch(url, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${OPENROUTER_API_KEY}`,
                "Content-Type": "application/json",
                "HTTP-Referer": location.origin, // Optional: for rankings on openrouter.ai
                "X-Title": document.title, // Optional: for rankings on openrouter.ai
              },
              body: JSON.stringify({
                model: OPENROUTER_MODEL,
                messages,
              }),
            });

            if (!response.ok) {
              const err = await safeJson(response);
              throw new Error(
                `API error: ${response.status} ${response.statusText} - ${
                  err?.error?.message || JSON.stringify(err)
                }`
              );
            }

            const data = await response.json();
            hideThinkingIndicator();

            const aiResponse =
              data.choices &&
              data.choices[0] &&
              data.choices[0].message &&
              data.choices[0].message.content
                ? data.choices[0].message.content
                : "No response from AI.";

            conversationHistory.push({
              role: "model",
              parts: [{ text: aiResponse }],
            });

            addMessage(aiResponse, "ai");
          } catch (error) {
            console.error("Error fetching from OpenRouter:", error);
            hideThinkingIndicator();
            addMessage(
              "Sorry, I couldn't get a response from the AI. Please try again later.",
              "ai"
            );
          }
        }

        // Initial state
        input.style.height = "auto"; // Ensure it starts at a single line
        autoResizeTextarea(input);
        toggleSendButton();
        addMessage(
          "Hello! I'm a friendly AI assistant. How can I help you today?",
          "ai"
        );
      });
    </script>
  </body>
</html>
