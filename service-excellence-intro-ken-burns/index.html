<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ken Burns Carousel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: black;
      }
      @keyframes zoomIn {
        0% {
          transform: scale(1) translate(0, 0);
        }
        100% {
          transform: scale(1.4) translate(0, 0);
        }
      }
      @keyframes zoomOut {
        0% {
          transform: scale(1.4) translate(0, 0);
        }
        100% {
          transform: scale(1) translate(0, 0);
        }
      }
      @keyframes panLeft {
        0% {
          transform: scale(1.2) translate(0, 0);
        }
        100% {
          transform: scale(1.2) translate(-10%, 0);
        }
      }
      @keyframes panRight {
        0% {
          transform: scale(1.2) translate(0, 0);
        }
        100% {
          transform: scale(1.2) translate(10%, 0);
        }
      }
      @keyframes panUp {
        0% {
          transform: scale(1.2) translate(0, 0);
        }
        100% {
          transform: scale(1.2) translate(0, -10%);
        }
      }
      @keyframes panDown {
        0% {
          transform: scale(1.2) translate(0, 0);
        }
        100% {
          transform: scale(1.2) translate(0, 10%);
        }
      }

      .kb-carousel {
        overflow: hidden;
        height: 100vh;
      }
      .kb-carousel .carousel-item {
        height: 100vh;
      }
      .kb-carousel .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.9;
        animation-duration: 20s;
        animation-fill-mode: forwards;
      }
    </style>
  </head>
  <body>
    <div
      id="carouselKenBurns"
      class="carousel slide kb-carousel carousel-fade"
      data-bs-ride="true"
      data-bs-interval="6000"
    >
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="nlu_smugmug_19.jpg" alt="Slide 1" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_30.jpg" alt="Slide 2" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_31.jpg" alt="Slide 3" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_32.jpg" alt="Slide 4" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_34.jpg" alt="Slide 5" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_47.jpg" alt="Slide 6" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_56.jpg" alt="Slide 7" />
        </div>
        <div class="carousel-item">
          <img src="nlu_smugmug_59.jpg" alt="Slide 8" />
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselKenBurns"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Prev</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselKenBurns"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const carousel = document.querySelector("#carouselKenBurns");
      const carouselInstance = new bootstrap.Carousel(carousel, {
        interval: 3000,
        ride: "carousel",
        pause: false,
      });

      const animations = [
        "zoomIn",
        "zoomOut",
        "panLeft",
        "panRight",
        "panUp",
        "panDown",
      ];
      const slides = document.querySelectorAll(".carousel-item img");

      function setRandomAnimation(img) {
        const anim = animations[Math.floor(Math.random() * animations.length)];
        img.style.animationName = anim;
      }

      slides.forEach((img) => setRandomAnimation(img));

      carousel.addEventListener("slide.bs.carousel", (e) => {
        const nextImg = e.relatedTarget.querySelector("img");
        setRandomAnimation(nextImg);
      });
    </script>
  </body>
</html>
