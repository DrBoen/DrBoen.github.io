<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phlebotomy Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060a28;
            color: #ffffff;
        }
        .jeopardy-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }
        .category-header {
            background-color: #1e293b;
            color: #f59e0b;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .point-cell {
            background-color: #334155;
            color: #f59e0b;
            font-weight: 700;
            font-size: 2rem;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .point-cell:hover {
            transform: scale(1.05);
            background-color: #475569;
        }
        .point-cell.answered {
            background-color: #1e293b;
            color: #475569;
            cursor: not-allowed;
            pointer-events: none;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background-color: #060a28;
            border: 4px solid #f59e0b;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-backdrop.active .modal-content {
            transform: scale(1);
        }
        #question-text, #answer-text {
            color: #ffffff;
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 1.3;
        }
        #answer-text {
            color: #10b981;
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

    <div class="container mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-white uppercase tracking-wider" style="color: #f59e0b;">Phlebotomy Jeopardy</h1>
            <p class="text-slate-300 mt-2">NHA Exam Prep Edition</p>
        </header>

        <main id="game-board" class="jeopardy-grid mb-6"></main>
        
        <footer class="text-center">
            <button id="reset-button" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105">
                Reset Game
            </button>
        </footer>
    </div>

    <!-- Question/Answer Modal -->
    <div id="modal" class="modal-backdrop">
        <div class="modal-content">
            <div id="question-container">
                <p id="question-text" class="mb-8"></p>
                <button id="reveal-answer-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-transform transform hover:scale-105">
                    Reveal Answer
                </button>
            </div>
            <div id="answer-container" class="hidden">
                <p id="answer-text" class="mb-8"></p>
                <button id="close-modal-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-transform transform hover:scale-105">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const gameData = {
            "Safety & Compliance": [
                { points: 100, question: "This includes gloves, gowns, and masks designed to protect you from infectious agents.", answer: "What is PPE (Personal Protective Equipment)?" },
                { points: 200, question: "The single most effective way to prevent the spread of infections, according to the CDC.", answer: "What is hand hygiene?" },
                { points: 300, question: "Used needles and other contaminated sharp objects must be disposed of in this type of container.", answer: "What is a puncture-resistant sharps container?" },
                { points: 400, question: "This federal agency sets and enforces standards to ensure safe and healthful working conditions.", answer: "What is OSHA?" },
                { points: 500, question: "The procedure to follow after an occupational exposure, such as a needlestick.", answer: "What is an exposure control plan?" }
            ],
            "Patient Preparation": [
                { points: 100, question: "The most important step before any collection; it involves matching information on the requisition with the patient's name and DOB.", answer: "What is positive patient identification?" },
                { points: 200, question: "A patient extending their arm for a blood draw is a form of this type of consent.", answer: "What is implied consent?" },
                { points: 300, question: "This form must be reviewed to verify patient demographics, tests ordered, and test priority (e.g., STAT).", answer: "What is a requisition form?" },
                { points: 400, question: "A patient must refrain from eating for a specific period (e.g., 8-12 hours) to meet this testing requirement.", answer: "What is a fasting state?" },
                { points: 500, question: "Drawing blood from an arm with an IV or a fistula is an example of a site you must do this.", answer: "What is avoid?" }
            ],
            "Routine Blood Collections": [
                { points: 100, question: "A tourniquet should not be left on a patient's arm for longer than this duration.", answer: "What is 1 minute?" },
                { points: 200, question: "When collecting tubes for coagulation, serum, and CBC tests, this is the correct order of draw.", answer: "What is coagulation (light blue), then serum (red/SST), then CBC (lavender)?" },
                { points: 300, question: "The recommended angle of needle insertion for a standard antecubital venipuncture.", answer: "What is 15 to 30 degrees?" },
                { points: 400, question: "This common complication occurs when blood leaks from the vein into surrounding tissue, forming a bruise.", answer: "What is a hematoma?" },
                { points: 500, question: "The proper technique for mixing additives in evacuated tubes to prevent clotting or hemolysis.", answer: "What is gentle inversion (8-10 times for most tubes)?" }
            ],
            "Special Collections": [
                { points: 100, question: "These tests require strict aseptic technique to detect microorganisms in the blood.", answer: "What are blood cultures?" },
                { points: 200, question: "The antiseptic agent that should NOT be used when collecting a sample for blood alcohol testing.", answer: "What is alcohol (e.g., isopropyl alcohol wipes)?" },
                { points: 300, question: "This type of collection, often done via a heel stick on infants, uses special filter paper to screen for metabolic disorders.", answer: "What is a newborn or PKU screen?" },
                { points: 400, question: "A blood glucose or hemoglobin A1c check performed on a handheld device at the patient's bedside is an example of this.", answer: "What is Point-of-Care Testing (POCT)?" },
                { points: 500, question: "This type of test requires collecting blood at specific time intervals after the patient drinks a glucose solution.", answer: "What is a Glucose Tolerance Test (GTT)?" }
            ],
            "Processing": [
                { points: 100, question: "The process of spinning blood tubes at high speed to separate serum or plasma from cells.", answer: "What is centrifuging?" },
                { points: 200, question: "Some specimens, like ammonia or lactic acid, must be chilled immediately in an ice slurry to maintain this.", answer: "What is specimen integrity?" },
                { points: 300, question: "The process of transferring a portion of a specimen (e.g., plasma) from one tube to another.", answer: "What is aliquoting?" },
                { points: 400, question: "This chronological documentation is required for forensic and toxicology specimens to ensure their integrity.", answer: "What is a chain of custody?" },
                { points: 500, question: "A test result that is significantly outside the normal range and could indicate a life-threatening condition must be reported immediately.", answer: "What are critical values?" }
            ]
        };

        const gameBoard = document.getElementById('game-board');
        const modal = document.getElementById('modal');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const questionContainer = document.getElementById('question-container');
        const answerContainer = document.getElementById('answer-container');
        const revealAnswerBtn = document.getElementById('reveal-answer-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const resetButton = document.getElementById('reset-button');
        
        let currentAnswer = '';

        function createBoard() {
            // Clear existing board
            gameBoard.innerHTML = '';

            // Get category names
            const categories = Object.keys(gameData);

            // Create category headers
            categories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.classList.add('category-header');
                categoryElement.textContent = category;
                gameBoard.appendChild(categoryElement);
            });

            // Create point cells
            for (let i = 0; i < 5; i++) { // For each point value
                categories.forEach(category => {
                    const questionData = gameData[category][i];
                    const cell = document.createElement('div');
                    cell.classList.add('point-cell');
                    cell.textContent = `$${questionData.points}`;
                    cell.dataset.category = category;
                    cell.dataset.points = questionData.points;
                    cell.addEventListener('click', handleCellClick);
                    gameBoard.appendChild(cell);
                });
            }
        }
        
        function handleCellClick(event) {
            const target = event.target;
            const category = target.dataset.category;
            const points = parseInt(target.dataset.points);

            const questionData = gameData[category].find(q => q.points === points);
            
            if (questionData) {
                questionText.textContent = questionData.question;
                currentAnswer = questionData.answer;
                
                // Reset modal state
                questionContainer.classList.remove('hidden');
                answerContainer.classList.add('hidden');
                
                modal.classList.add('active');
                target.classList.add('answered');
            }
        }

        function revealAnswer() {
            answerText.textContent = currentAnswer;
            questionContainer.classList.add('hidden');
            answerContainer.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function resetGame() {
            createBoard(); // Re-creates the board from scratch
        }

        // Event Listeners
        revealAnswerBtn.addEventListener('click', revealAnswer);
        closeModalBtn.addEventListener('click', closeModal);
        resetButton.addEventListener('click', resetGame);
        
        // Close modal if clicking on the backdrop
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize Game
        createBoard();

    </script>
</body>
</html>
